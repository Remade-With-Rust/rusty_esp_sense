[package]
name = "rusty_esp_sense"
description = "Janus W6: the home computer's model over Wi-Fi channel state -- fixed random features, a readout calibrated per room, and a benchmark that holds out whole captures."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["esp32", "wifi-sensing", "csi", "mata", "remade-with-rust"]
categories = ["science", "command-line-utilities"]
# Not yet: its sibling dependencies are git branches until the Janus W5 PRs
# merge and publish.
publish = false

[features]
default = ["rusty-alloc"]
# The binary's allocator is rusty_alloc (the library never declares one).
# It keeps freed segments committed, so the megabyte-scale buffers every fit
# makes come back as warm pages: the benchmark runs 5-8 % faster and its
# peak working set is larger (docs/PERF.md). Without the feature the binary
# uses the system allocator.
rusty-alloc = ["dep:rusty_alloc-api"]
# `rusty_esp_sense watch <ticket>`: subscribe to a device's (or a bridge's)
# W5 CSI stream over iroh and read the room live. Off by default so the
# offline build carries no network stack.
live = ["dep:rusty_esp_iroh-host", "dep:tokio"]
# The stage profiler, the work counters and (in the binary) the allocation
# census. Development only; off, every scope and counter compiles to nothing.
profile = []

[dependencies]
rusty_esp_signal-core = { workspace = true, features = ["std"] }
candle-core = { workspace = true }
rayon = { workspace = true }
# The binary's allocator (the library declares none; feature `rusty-alloc`):
# the Remade With Rust family's pure-Rust allocator.
rusty_alloc-api = { version = "2.2", optional = true }
serde_json = { workspace = true }
memchr = "2.7"
rusty_esp_iroh-host = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
