name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      # The default build only: `live` needs rusty_esp_iroh's W5 branch to
      # resolve rusty_esp_signal's W5 branch, which it does only inside the
      # Janus umbrella checkout until the W5 PRs merge (README, "Where it runs").
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The rule this repo learned the hard way (2026-10-08): every other job
  # resolves from the committed Cargo.lock, so a sibling repo releasing a new
  # MINOR cannot break them -- the breakage waits, invisible, until someone
  # edits a manifest and forces a re-resolve. It waited weeks here, and the
  # repo was unbuildable by anyone without a local checkout the whole time.
  #
  # This job throws the lock away and resolves from scratch, so that drift
  # surfaces on the day it happens. It does not build: resolution is the
  # whole question, and `cargo metadata` answers it in seconds.
  resolve:
    name: resolve without the lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: resolve from scratch
        run: |
          rm -f Cargo.lock
          cargo metadata --format-version 1 > /dev/null

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
